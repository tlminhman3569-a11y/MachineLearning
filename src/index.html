<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <title>Tetris</title>
</head>
<body>

<!-- Trang giao diện Main menu-->
<div class="main-menu-screen hidden" id="main-menu-screen">

<!--    Header main menu-->
    <div class="menu-header">
        <h1 class="header-title">Chọn độ khó cho game</h1>
    </div>

<!--    Body main menu-->
    <div class="menu-body">

        <ul class="level-list">

<!-- Level 1-->
            <li class="level-item">
                <button class="btn-level" data-level="1">

                    <div class="card-header">
                        <span class="level-title">LEVEL 1</span>
                    </div>

                    <div class="card-body">
                        <h2 class="main-title">Cổ điển</h2>
                        <span class="description">Luật cổ điển. Xếp kín hàng để tích điểm</span>
                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>

            <!-- Level 2-->
            <li class="level-item">
                <button class="btn-level" data-level="2">

                    <div class="card-header">
                        <span class="level-title">LEVEL 2</span>
                    </div>

                    <div class="card-body">
                        <h2 class="main-title">Cổ điển</h2>
                        <span class="description">Luật cổ điển. Xếp kín hàng để tích điểm</span>
                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>

            <!-- Level 3-->
            <li class="level-item">
                <button class="btn-level" data-level="3">

                    <div class="card-header">
                        <span class="level-title">LEVEL 3</span>
                    </div>

                    <div class="card-body">
                        <h2 class="main-title">Cổ điển</h2>
                        <span class="description">Luật cổ điển. Xếp kín hàng để tích điểm</span>
                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>

            <!-- Level 4-->
            <li class="level-item">
                <button class="btn-level" data-level="4">

                    <div class="card-header">
                        <span class="level-title">LEVEL 4</span>
                    </div>

                    <div class="card-body">
                        <h2 class="main-title">Cổ điển</h2>
                        <span class="description">Luật cổ điển. Xếp kín hàng để tích điểm</span>
                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>

            <!-- Level 5-->
            <li class="level-item">
                <button class="btn-level" data-level="5">

                    <div class="card-header">
                        <span class="level-title">LEVEL 5</span>
                    </div>

                    <div class="card-body">
                        <h2 class="main-title">Cổ điển</h2>
                        <span class="description">Luật cổ điển. Xếp kín hàng để tích điểm</span>
                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>

            <!-- Level 6-->
            <li class="level-item">
                <button class="btn-level" data-level="6">

                    <div class="card-header">
                        <span class="level-title">LEVEL 6</span>
                    </div>

                    <div class="card-body">
                        <h2 class="main-title">Cổ điển</h2>
                        <span class="description">Luật cổ điển. Xếp kín hàng để tích điểm</span>
                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>
        </ul>
    </div>

    <div class="menu-footer">
        <button class="btn-play">
            <i class="fa-solid fa-play"></i>
            <span class="play-title">PLAY NOW</span>
        </button>
    </div>


</div>

<!-- trang giao diện chơi-->
<div id="play-screen" class="play-screen">

<!--    Lớp phủ dừng màn hình-->
    <div class="pause-overlay hidden">
        <div class="pause-panel">
            <div class="panel-title">
                <i class="fa-solid fa-pause"></i>
                <p class = "panel-header-title">PAUSE GAME</p>
            </div>


            <div class="panel-option">
                <button class="resume" id="resume">
                    <i class="fa-regular fa-circle-play"></i>
                    <span class="resume-title">Resume</span>
                </button>

                <button class="Restart" id="restart">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="restart-title">Restart</span>
                </button>

                <button class="main-menu" id="main-menu">
                    <i class="fa-solid fa-house"></i>
                    <span class="resume-title">Main Menu</span>
                </button>
            </div>
        </div>
    </div>

<!--    Màn hình vẽ tetris-->
    <div class="canvas-wrapper">
        <canvas id="tetris-screen" class="tetris-screen"></canvas>
    </div>

<!-- Khối dự đoán tetris tiếp theo-->
    <div class="next-tetris-wrapper">
        <div class="next-tetris-group">
            <p class="next-title">NEXT PIECE</p>
            <canvas class="next-tetris" id="next-tetris"></canvas>
        </div>
    </div>

<!--    Sidebar bên cạnh-->
    <div class="sidebar">

<!--        Khối thông tin level-->
        <div class="level-block">
            <div class="level-information">
                <p class="title">Level
                    <span class="current-level" id = "current-level"> 1</span>
                </p>
            </div>

            <div class="score-wrapper">
                <p class="current-score">Score</p>
                <p class="current-score-point">24440</p>
            </div>

            <div class="target-wrapper">
                <p class="target-score">Target score</p>
                <p class="target-score-point">24440</p>
            </div>
        </div>


<!--        Khối pause-->
        <div class="pause-wrapper">
            <button class="pause">
                <i class="fa-solid fa-pause"></i>
                <span class="pause-title">PAUSE GAME</span>
            </button>
        </div>

    </div>
</div>
<!--Script-->
<script src="index.js"></script>
</body>
</html>
