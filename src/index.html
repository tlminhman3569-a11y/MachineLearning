<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <title>Tetris</title>
</head>
<body>

<!-- Main menu-->
<div class="main-menu" id="main-menu">

<!--    Header main menu-->
    <div class="menu-header">
        <h1 class="header-title">Chọn độ khó cho game</h1>
    </div>

<!--    Body main menu-->
    <div class="menu-body">

        <ul class="level-list">

<!-- Level 1-->
            <li class="level-item">
                <button class="btn-level" data-level="1">

                    <div class="card-header">
                        <span class="level-title">LEVEL 01</span>
                    </div>

                    <div class="card-body">
                        <h2 class="main-title">Cổ điển</h2>
                        <span class="description">Luật cổ điển. Xếp kín hàng để tích điểm</span>
                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>

            <!-- Level 2-->
            <li class="level-item">
                <button class="btn-level" data-level="2">

                    <div class="card-header">

                    </div>
                </button>
            </li>

            <!-- Level 3-->

                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>

            <!-- Level 4-->
            <li class="level-item">
                <button class="btn-level" data-level="4">

                    <div class="card-header">
                        <span class="level-title">LEVEL 04</span>
                    </div>

                        <span class="description">Luật cổ điển. Xếp kín hàng để tích điểm</span>

                </button>
            </li>

            <!-- Level 5-->

                    </div>

                    <div class="card-footer">
                        <span class="score-point">Target: 500</span>
                    </div>
                </button>
            </li>

            <!-- Level 6-->

                <button class="btn-level" data-level="6">

                    <div class="card-header">

        </ul>
    </div>

    <div class="menu-footer">
        <button class="btn-play">
            <i class="fa-solid fa-play"></i>
            <span class="play-title">PLAY NOW</span>
        </button>
    </div>


</div>

</html>
